<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organic Chemistry Flashcards</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f2eb;
    --surface: #fffef9;
    --border: #d9d4c7;
    --text: #1a1814;
    --muted: #7a7568;
    --accent: #c84b2f;
    --accent-light: #f5e8e4;
    --green: #2d6a4f;
    --green-light: #e6f0eb;
    --purple: #4a3880;
    --purple-light: #eeeaf7;
    --amber: #8a5c1a;
    --amber-light: #f5ecd8;
    --blue: #1a4d78;
    --blue-light: #e3eef7;
    --radius: 12px;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
  }

  /* noise texture overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.5;
  }

  header {
    padding: 3rem 2rem 1.5rem;
    max-width: 780px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  .logo {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }

  h1 {
    font-family: 'DM Mono', monospace;
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    font-weight: 400;
    line-height: 1.15;
    letter-spacing: -0.02em;
    color: var(--text);
  }

  h1 span { color: var(--accent); }

  .subtitle {
    font-size: 14px;
    color: var(--muted);
    margin-top: 0.5rem;
    font-weight: 300;
  }

  .main {
    max-width: 780px;
    margin: 0 auto;
    padding: 0 2rem 4rem;
    position: relative;
    z-index: 1;
  }

  /* Category filter */
  .cat-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 2rem;
  }

  .cat-btn {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 99px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .cat-btn:hover { border-color: var(--text); color: var(--text); }

  .cat-btn.active-all    { background: var(--text); color: var(--bg); border-color: var(--text); }
  .cat-btn.active-aliphatic { background: var(--green); color: #fff; border-color: var(--green); }
  .cat-btn.active-aromatic  { background: var(--purple); color: #fff; border-color: var(--purple); }
  .cat-btn.active-grignard  { background: var(--amber); color: #fff; border-color: var(--amber); }
  .cat-btn.active-test      { background: var(--blue); color: #fff; border-color: var(--blue); }

  /* Progress bar */
  .progress-wrap {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
  }

  .progress-label {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }

  .score-badges {
    display: flex;
    gap: 8px;
  }

  .badge {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 99px;
    font-weight: 500;
  }

  .badge-knew { background: var(--green-light); color: var(--green); }
  .badge-missed { background: #fce8e4; color: var(--accent); }

  .progress-bar-bg {
    height: 2px;
    background: var(--border);
    border-radius: 2px;
    margin-bottom: 1.5rem;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: var(--text);
    border-radius: 2px;
    transition: width 0.3s ease;
  }

  /* Card flip */
  .card-scene {
    perspective: 1200px;
    cursor: pointer;
    margin-bottom: 1.5rem;
    user-select: none;
    min-height: 200px;
  }

  /* The inner wrapper doubles in height to hold both faces stacked;
     we shift it up by 50% so only one face is visible at a time */
  .card-inner {
    width: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
  }

  .card-inner.flipped { transform: rotateY(180deg); }

  .card-face {
    width: 100%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2.5rem 2rem;
    text-align: center;
    min-height: 200px;
    box-sizing: border-box;
  }

  /* front sits normally in flow */
  .card-face.front {
    position: relative;
    overflow: hidden;
  }

  /* back is absolutely positioned on top, rotated 180deg,
     same size as front — we read its height from JS */
  .card-face.back {
    position: absolute;
    inset: 0;
    transform: rotateY(180deg);
    background: var(--text);
    border-color: var(--text);
    height: 100%;
    overflow: hidden;
  }

  /* decorative corner on front */
  .card-face.front::after {
    content: '';
    position: absolute;
    bottom: -30px; right: -30px;
    width: 100px; height: 100px;
    border-radius: 50%;
    background: var(--accent-light);
    opacity: 0.6;
    pointer-events: none;
  }

  .card-cat-tag {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 99px;
    margin-bottom: 1rem;
    font-weight: 500;
  }

  .tag-all       { background: #e8e4de; color: var(--muted); }
  .tag-aliphatic { background: var(--green-light); color: var(--green); }
  .tag-aromatic  { background: var(--purple-light); color: var(--purple); }
  .tag-grignard  { background: var(--amber-light); color: var(--amber); }
  .tag-test      { background: var(--blue-light); color: var(--blue); }

  .card-q {
    font-size: clamp(15px, 2.5vw, 18px);
    font-weight: 400;
    line-height: 1.5;
    color: var(--text);
    position: relative;
    z-index: 1;
    max-width: 560px;
  }

  .card-hint {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--border);
    margin-top: 1.2rem;
    letter-spacing: 0.06em;
    position: relative;
    z-index: 1;
  }

  /* back face */
  .card-a {
    font-size: clamp(14px, 2.2vw, 16px);
    font-weight: 400;
    color: #f5f2eb;
    line-height: 1.6;
    max-width: 560px;
    margin-bottom: 10px;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }

  .card-detail {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: #9a9488;
    line-height: 1.5;
    max-width: 540px;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }

  /* Controls */
  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 1rem;
  }

  .btn {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.06em;
    padding: 10px 20px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .btn:hover:not(:disabled) { background: var(--text); color: var(--bg); border-color: var(--text); }
  .btn:disabled { opacity: 0.25; cursor: default; }
  .btn-shuffle { margin-left: auto; }

  /* Score row */
  .score-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 1rem;
    animation: fadeUp 0.25s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .btn-knew {
    background: var(--green-light);
    color: var(--green);
    border-color: #b5d4c3;
    flex: 1;
    max-width: 200px;
    font-size: 13px;
    padding: 10px;
  }

  .btn-knew:hover { background: var(--green); color: #fff; border-color: var(--green); }

  .btn-missed {
    background: var(--accent-light);
    color: var(--accent);
    border-color: #e8c4bc;
    flex: 1;
    max-width: 200px;
    font-size: 13px;
    padding: 10px;
  }

  .btn-missed:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* keyboard hint */
  .key-hint {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--border);
    text-align: center;
    margin-top: 0.5rem;
    letter-spacing: 0.05em;
  }

  /* Results screen */
  .results {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 3rem 2rem;
    text-align: center;
    display: none;
  }

  .results.visible { display: block; }

  .results-title {
    font-family: 'DM Mono', monospace;
    font-size: 1.6rem;
    font-weight: 400;
    margin-bottom: 0.5rem;
  }

  .results-sub {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 2rem;
  }

  .results-grid {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin-bottom: 2rem;
  }

  .results-stat {
    padding: 1.2rem 2rem;
    border-radius: var(--radius);
    min-width: 110px;
  }

  .results-stat .num {
    font-family: 'DM Mono', monospace;
    font-size: 2.5rem;
    font-weight: 300;
    display: block;
  }

  .results-stat .lbl {
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .stat-knew   { background: var(--green-light); color: var(--green); }
  .stat-missed { background: var(--accent-light); color: var(--accent); }

  .btn-restart {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    padding: 12px 32px;
    border-radius: var(--radius);
    border: 1px solid var(--text);
    background: var(--text);
    color: var(--bg);
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .btn-restart:hover { background: transparent; color: var(--text); }

  @media (max-width: 540px) {
    header { padding: 2rem 1.2rem 1rem; }
    .main { padding: 0 1.2rem 3rem; }
    .controls { flex-wrap: wrap; }
    .btn-shuffle { margin-left: 0; }
    .card-face { padding: 1.8rem 1.2rem; }
  }
</style>
</head>
<body>

<header>
  <p class="logo">A-Level Chemistry</p>
  <h1>Organic<br><span>Reactions</span></h1>
  <p class="subtitle">52 cards — aliphatic · aromatic · Grignard · functional group tests</p>
</header>

<div class="main">

  <div class="cat-row" id="catRow"></div>

  <div class="progress-wrap">
    <span class="progress-label" id="progressLabel">Card 1 of 52</span>
    <div class="score-badges">
      <span class="badge badge-knew" id="knewBadge" style="display:none"></span>
      <span class="badge badge-missed" id="missedBadge" style="display:none"></span>
    </div>
  </div>

  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
  </div>

  <!-- Flashcard -->
  <div id="cardSection">
    <div class="card-scene" id="cardScene" onclick="flip()" title="Click to flip">
      <div class="card-inner" id="cardInner">
        <div class="card-face front">
          <span class="card-cat-tag" id="frontTag"></span>
          <p class="card-q" id="questionText"></p>
          <p class="card-hint">click to reveal answer</p>
        </div>
        <div class="card-face back">
          <span class="card-cat-tag" id="backTag"></span>
          <p class="card-a" id="answerText"></p>
          <p class="card-detail" id="detailText"></p>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="prevBtn" onclick="prev()">← prev</button>
      <button class="btn" id="nextBtn" onclick="next()">next →</button>
      <button class="btn btn-shuffle" onclick="shuffle()">shuffle</button>
    </div>

    <div class="score-row" id="scoreRow" style="display:none">
      <button class="btn btn-knew" onclick="markKnew()">✓ knew it</button>
      <button class="btn btn-missed" onclick="markMissed()">✗ missed it</button>
    </div>

    <p class="key-hint">space = flip &nbsp;·&nbsp; ← → = navigate &nbsp;·&nbsp; k = knew &nbsp;·&nbsp; m = missed</p>
  </div>

  <!-- Results screen -->
  <div class="results" id="resultsScreen">
    <p class="results-title" id="resultsTitle">Done!</p>
    <p class="results-sub" id="resultsSub"></p>
    <div class="results-grid">
      <div class="results-stat stat-knew">
        <span class="num" id="knewNum">0</span>
        <span class="lbl">knew it</span>
      </div>
      <div class="results-stat stat-missed">
        <span class="num" id="missedNum">0</span>
        <span class="lbl">missed it</span>
      </div>
    </div>
    <button class="btn-restart" onclick="restart()">go again</button>
  </div>

</div>

<script>
const CARDS = [
  {cat:"aliphatic",q:"Alkene → Poly(alkene)",a:"High pressure + catalyst (Ziegler-Natta or radical initiator)",detail:"Mechanism: addition polymerisation"},
  {cat:"aliphatic",q:"Alkene → Dihalogenoalkane (X₂)",a:"Br₂ or Cl₂, room temperature, no catalyst needed",detail:"Mechanism: electrophilic addition across C=C"},
  {cat:"aliphatic",q:"Alkene → Halogenoalkane (HX)",a:"HBr or HCl, room temperature, no catalyst",detail:"Markovnikov's rule: H adds to C with more H; electrophilic addition"},
  {cat:"aliphatic",q:"Alkene → Alkane",a:"H₂, Ni catalyst, ~150°C",detail:"Mechanism: catalytic hydrogenation (addition-reduction)"},
  {cat:"aliphatic",q:"Alkene → Alcohol (hydration)",a:"H₂O(g), conc. H₃PO₄ catalyst, ~300°C, 60 atm",detail:"Mechanism: electrophilic addition of water across double bond"},
  {cat:"aliphatic",q:"Alkene → Diol",a:"Cold, dilute KMnO₄",detail:"Hot conc. KMnO₄ cleaves the double bond instead — conditions matter"},
  {cat:"aliphatic",q:"Alcohol (primary) → Aldehyde",a:"K₂Cr₂O₇ / dil. H₂SO₄, warm gently and distil immediately",detail:"Distillation prevents oxidation to carboxylic acid; Cr²⁺ orange → green"},
  {cat:"aliphatic",q:"Alcohol (secondary) → Ketone",a:"K₂Cr₂O₇ / dil. H₂SO₄, heat under reflux",detail:"Ketones resist further oxidation; Cr orange → green"},
  {cat:"aliphatic",q:"Alcohol (primary) → Carboxylic acid",a:"Excess K₂Cr₂O₇ / dil. H₂SO₄, heat under reflux",detail:"Full oxidation: alcohol → aldehyde → carboxylic acid (two steps)"},
  {cat:"aliphatic",q:"Alcohol → Halogenoalkane",a:"PCl₅ (any alcohol) or NaBr/H₂SO₄ (→ bromoalkane) or P + I₂ (→ iodoalkane); heat under reflux",detail:"PCl₅ gives steamy HCl fumes — used as a test for –OH group"},
  {cat:"aliphatic",q:"Alcohol → Alkene (dehydration)",a:"Conc. H₃PO₄ or conc. H₂SO₄, heat (~170°C)",detail:"Mechanism: elimination; removes H and OH from adjacent carbons"},
  {cat:"aliphatic",q:"Alcohol + Carboxylic acid → Ester",a:"Conc. H₂SO₄ catalyst, heat under reflux",detail:"Fischer esterification; reversible equilibrium — use excess of one reactant"},
  {cat:"aliphatic",q:"Aldehyde or Ketone → Hydroxynitrile",a:"HCN + KCN (KCN provides the CN⁻ nucleophile)",detail:"Mechanism: nucleophilic addition; product has both –OH and –CN; chain +1 C"},
  {cat:"aliphatic",q:"Aldehyde or Ketone → Alcohol",a:"LiAlH₄ in dry ether, then H₂O workup; or NaBH₄ in ethanol",detail:"Mechanism: reduction; LiAlH₄ is stronger and reduces more functional groups"},
  {cat:"aliphatic",q:"Carboxylic acid → Ester (direct)",a:"Alcohol + conc. H₂SO₄, heat",detail:"Same mechanism as Fischer esterification — reversible"},
  {cat:"aliphatic",q:"Carboxylic acid → Acyl chloride",a:"PCl₅ (phosphorus pentachloride), room temperature",detail:"Vigorous reaction; produces steamy HCl fumes; product is very reactive"},
  {cat:"aliphatic",q:"Halogenoalkane → Alkene",a:"KOH in ethanol (alcoholic), heat under reflux",detail:"Mechanism: elimination (E2); OH⁻ acts as base, removes β-H"},
  {cat:"aliphatic",q:"Halogenoalkane → Alcohol",a:"KOH in water (aqueous), heat under reflux",detail:"Mechanism: nucleophilic substitution (SN2); OH⁻ acts as nucleophile"},
  {cat:"aliphatic",q:"Halogenoalkane → Primary amine",a:"Excess alcoholic NH₃, heat under pressure in sealed tube",detail:"Mechanism: nucleophilic substitution; excess NH₃ minimises over-alkylation"},
  {cat:"aliphatic",q:"Halogenoalkane → Nitrile",a:"KCN in ethanol, heat under reflux",detail:"Mechanism: nucleophilic substitution; carbon chain extended by 1 C"},
  {cat:"aliphatic",q:"Halogenoalkane → 2° or 3° Amine",a:"React with a primary or secondary amine; nucleophilic substitution",detail:"Mixture of products possible; excess amine helps shift towards desired product"},
  {cat:"aliphatic",q:"Alkane → Halogenoalkane",a:"Br₂ or Cl₂, UV light (no catalyst)",detail:"Mechanism: free radical substitution — initiation, propagation, termination"},
  {cat:"aliphatic",q:"Acyl chloride → Ester",a:"Alcohol, room temperature — no catalyst needed",detail:"Mechanism: nucleophilic addition-elimination; much faster than Fischer"},
  {cat:"aliphatic",q:"Acyl chloride → Primary amide",a:"Excess NH₃, room temperature",detail:"Mechanism: nucleophilic addition-elimination; vigorous with HCl fumes"},
  {cat:"aliphatic",q:"Acyl chloride → Secondary amide",a:"Primary amine (RNH₂), room temperature",detail:"Mechanism: nucleophilic addition-elimination"},
  {cat:"aliphatic",q:"Nitrile → Primary amine",a:"LiAlH₄ in dry ether, then H₂O workup",detail:"Mechanism: reduction; –C≡N → –CH₂NH₂"},
  {cat:"aliphatic",q:"Nitrile → Carboxylic acid",a:"Dilute HCl or H₂SO₄, heat under reflux (acid hydrolysis)",detail:"Base hydrolysis (NaOH) gives carboxylate salt instead"},
  {cat:"aliphatic",q:"Ester or Amide → hydrolysis",a:"NaOH(aq) under reflux (irreversible), or dilute acid + heat (reversible)",detail:"Ester + NaOH → carboxylate salt + alcohol (saponification)"},
  {cat:"aromatic",q:"Benzene → Bromobenzene",a:"Br₂, anhydrous FeBr₃ catalyst (Lewis acid), room temperature",detail:"Mechanism: electrophilic aromatic substitution (EAS); FeBr₃ activates Br₂"},
  {cat:"aromatic",q:"Benzene → Nitrobenzene",a:"Conc. HNO₃ + conc. H₂SO₄, ~50°C",detail:"H₂SO₄ protonates HNO₃ → NO₂⁺ electrophile; above 55°C gets dinitration"},
  {cat:"aromatic",q:"Benzene → Alkylbenzene (Friedel-Crafts alkylation)",a:"Chloroalkane + anhydrous AlCl₃ catalyst",detail:"AlCl₃ generates carbocation electrophile; EAS; prone to rearrangement"},
  {cat:"aromatic",q:"Benzene → Acylbenzene (Friedel-Crafts acylation)",a:"Acyl chloride (RCOCl) + anhydrous AlCl₃ catalyst",detail:"Generates acylium ion RC≡O⁺; EAS; no rearrangement — preferred for synthesis"},
  {cat:"aromatic",q:"Benzene → Sulfonated benzene",a:"Fuming H₂SO₄ (oleum / excess SO₃), heat",detail:"EAS; reversible at high temperatures — can desulfonate with steam"},
  {cat:"aromatic",q:"Benzene → Cyclohexane",a:"H₂ (3 equiv.), Ni or Pt catalyst, high pressure and heat",detail:"Full ring hydrogenation; much harder than alkene reduction"},
  {cat:"aromatic",q:"Nitrobenzene → Phenylamine (aniline)",a:"Sn metal + conc. HCl, heat under reflux; neutralise with NaOH",detail:"6-electron reduction of –NO₂ → –NH₂; Sn/HCl is the classic reagent"},
  {cat:"aromatic",q:"Phenylamine → Diazonium salt",a:"NaNO₂ + HCl, temperature kept strictly below 10°C",detail:"Above 10°C diazonium decomposes; used in azo dye synthesis"},
  {cat:"aromatic",q:"Diazonium salt → Azo dye",a:"Coupling with phenol or amine in NaOH solution",detail:"N₂⁺ acts as electrophile attacking activated ring; gives –N=N– (azo) linkage"},
  {cat:"grignard",q:"Halogenoalkane → Grignard reagent",a:"Mg metal in dry ether; must be absolutely anhydrous (water destroys it)",detail:"Product RMgX has partial –ve on C, acting as a nucleophilic carbon"},
  {cat:"grignard",q:"Grignard + Methanal (HCHO) → ?",a:"Primary alcohol (after H₂O workup): RCH₂OH",detail:"Chain extended by 1 carbon; RMgX + HCHO → RCH₂OMgX → RCH₂OH"},
  {cat:"grignard",q:"Grignard + Aldehyde (R'CHO) → ?",a:"Secondary alcohol (after H₂O workup): RCH(OH)R'",detail:"Chain extended; two different R groups on the CHOH carbon"},
  {cat:"grignard",q:"Grignard + Ketone (R'COR'') → ?",a:"Tertiary alcohol (after H₂O workup): RR'R''COH",detail:"Three R groups on the carbon bearing –OH; no H on that carbon"},
  {cat:"grignard",q:"Grignard + CO₂ → ?",a:"Carboxylic acid (after H₂O workup): RCO₂H",detail:"Chain extended by 1 C as –COOH; useful way to add a carboxyl group"},
  {cat:"test",q:"Test for an alkene",a:"Add bromine water — orange/brown decolourises to colourless",detail:"Br₂ undergoes electrophilic addition across C=C; alkanes don't react"},
  {cat:"test",q:"Test for a carbonyl group (C=O) — aldehyde or ketone",a:"2,4-DNP reagent — orange or yellow crystalline precipitate forms",detail:"Precipitate can be filtered, dried and m.p. measured to ID the compound"},
  {cat:"test",q:"Distinguish aldehyde from ketone — Test 1",a:"Tollens' reagent ([Ag(NH₃)₂]⁺) — aldehyde gives silver mirror; ketone: no change",detail:"Ag⁺ reduced to Ag metal by aldehyde; heat gently in a clean test tube"},
  {cat:"test",q:"Distinguish aldehyde from ketone — Test 2",a:"Fehling's solution (blue Cu²⁺) — aldehyde gives brick-red Cu₂O precipitate; ketone: no change",detail:"Heat required; Cu²⁺ (blue) → Cu₂O (red/brown precipitate)"},
  {cat:"test",q:"Test for a carboxylic acid",a:"Add Na₂CO₃ solution — effervescence (CO₂ bubbles produced)",detail:"Also reacts with Na metal; Na₂CO₃ is more specific as alcohols don't react with it"},
  {cat:"test",q:"Test for an –OH group (alcohol, phenol, or carboxylic acid)",a:"Sodium metal — effervescence of H₂ gas",detail:"PCl₅ also works — gives misty HCl fumes with any –OH"},
  {cat:"test",q:"Test for a chloroalkane",a:"Warm with AgNO₃(aq) — slow white precipitate of AgCl",detail:"Bromoalkane: cream ppt (faster); iodoalkane: yellow ppt (fastest)"},
  {cat:"test",q:"Test for an acyl chloride",a:"AgNO₃(aq) — vigorous reaction, steamy HCl fumes, rapid white AgCl precipitate",detail:"Much more vigorous than chloroalkane — useful to distinguish the two"},
  {cat:"test",q:"Test for 1° or 2° alcohol, or aldehyde (oxidation test)",a:"K₂Cr₂O₇ / H₂SO₄ — orange to green colour change on warming",detail:"Ketones and carboxylic acids do NOT change dichromate; 3° alcohols: no change"}
];

const cards = CARDS;

const CAT_LABELS = {
  all: "All",
  aliphatic: "Aliphatic",
  aromatic: "Aromatic",
  grignard: "Grignard",
  test: "Functional tests"
};

let activeCat = "all";
let deck = [];
let idx = 0;
let knew = 0, missed = 0;
let isFlipped = false;
let scored = 0; // how many have been scored in current deck

function getDeck() {
  return activeCat === "all" ? [...cards] : cards.filter(c => c.cat === activeCat);
}

function tagClass(cat) {
  return "card-cat-tag tag-" + cat;
}

function syncHeight() {
  const front = document.querySelector('.card-face.front');
  const back = document.querySelector('.card-face.back');
  const scene = document.getElementById('cardScene');
  const inner = document.getElementById('cardInner');
  // measure front face natural height
  const frontHeight = front.offsetHeight;
  const backHeight = back.offsetHeight;
  // use the greater height to accommodate both faces
  const maxHeight = Math.max(frontHeight, backHeight);
  scene.style.height = maxHeight + 'px';
  inner.style.height = maxHeight + 'px';
  // also size the back face to match
  back.style.height = maxHeight + 'px';
}

function render() {
  const c = deck[idx];
  document.getElementById("questionText").textContent = c.q;
  document.getElementById("answerText").textContent = c.a;
  document.getElementById("detailText").textContent = c.detail;
  const label = CAT_LABELS[c.cat] || c.cat;
  document.getElementById("frontTag").className = tagClass(c.cat);
  document.getElementById("frontTag").textContent = label;
  document.getElementById("backTag").className = tagClass(c.cat);
  document.getElementById("backTag").textContent = label;
  document.getElementById("progressLabel").textContent = `Card ${idx+1} of ${deck.length}`;
  document.getElementById("progressFill").style.width = ((idx+1)/deck.length*100).toFixed(1) + "%";
  document.getElementById("cardInner").classList.remove("flipped");
  document.getElementById("scoreRow").style.display = "none";
  document.getElementById("prevBtn").disabled = idx === 0;
  document.getElementById("nextBtn").disabled = idx === deck.length - 1;
  isFlipped = false;
  updateScoreBadges();
  // defer height sync until DOM has painted
  requestAnimationFrame(syncHeight);
}

function updateScoreBadges() {
  const kb = document.getElementById("knewBadge");
  const mb = document.getElementById("missedBadge");
  if (knew + missed === 0) { kb.style.display = "none"; mb.style.display = "none"; return; }
  kb.style.display = "inline"; kb.textContent = `✓ ${knew}`;
  mb.style.display = "inline"; mb.textContent = `✗ ${missed}`;
}

function flip() {
  isFlipped = !isFlipped;
  document.getElementById("cardInner").classList.toggle("flipped", isFlipped);
  document.getElementById("scoreRow").style.display = isFlipped ? "flex" : "none";
}

function next() {
  if (idx < deck.length - 1) { idx++; render(); }
}

function prev() {
  if (idx > 0) { idx--; render(); }
}

function markKnew() {
  knew++;
  scored++;
  if (scored >= deck.length) { showResults(); return; }
  if (idx < deck.length - 1) { idx++; render(); }
}

function markMissed() {
  missed++;
  scored++;
  if (scored >= deck.length) { showResults(); return; }
  if (idx < deck.length - 1) { idx++; render(); }
}

function shuffle() {
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  idx = 0; knew = 0; missed = 0; scored = 0;
  render();
}

function showResults() {
  document.getElementById("cardSection").style.display = "none";
  const rs = document.getElementById("resultsScreen");
  rs.classList.add("visible");
  const pct = Math.round(knew / deck.length * 100);
  document.getElementById("resultsTitle").textContent = pct >= 80 ? "Excellent work!" : pct >= 50 ? "Good effort!" : "Keep practising!";
  document.getElementById("resultsSub").textContent = `You scored ${pct}% on ${deck.length} cards`;
  document.getElementById("knewNum").textContent = knew;
  document.getElementById("missedNum").textContent = missed;
}

function restart() {
  knew = 0; missed = 0; idx = 0; scored = 0;
  deck = getDeck();
  document.getElementById("resultsScreen").classList.remove("visible");
  document.getElementById("cardSection").style.display = "block";
  render();
}

// Build category buttons
const catRow = document.getElementById("catRow");
const cats = ["all", "aliphatic", "aromatic", "grignard", "test"];
cats.forEach(cat => {
  const count = cat === "all" ? cards.length : cards.filter(c => c.cat === cat).length;
  const btn = document.createElement("button");
  btn.className = "cat-btn" + (cat === activeCat ? " active-" + cat : "");
  btn.textContent = `${CAT_LABELS[cat]} (${count})`;
  btn.onclick = () => {
    document.querySelectorAll(".cat-btn").forEach(b => b.className = "cat-btn");
    btn.className = "cat-btn active-" + cat;
    activeCat = cat;
    knew = 0; missed = 0; idx = 0; scored = 0;
    deck = getDeck();
    document.getElementById("resultsScreen").classList.remove("visible");
    document.getElementById("cardSection").style.display = "block";
    render();
  };
  catRow.appendChild(btn);
});

// Keyboard shortcuts
document.addEventListener("keydown", e => {
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); }
  if (e.key === "ArrowRight") next();
  if (e.key === "ArrowLeft") prev();
  if ((e.key === "k" || e.key === "K") && isFlipped) markKnew();
  if ((e.key === "m" || e.key === "M") && isFlipped) markMissed();
});

window.addEventListener("resize", () => { if (!isFlipped) syncHeight(); });

// Init
deck = getDeck();
render();
</script>
</body>
</html>
