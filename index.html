<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chemistry IAL Flashcards</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f2eb;
    --surface: #fffef9;
    --border: #d9d4c7;
    --text: #1a1814;
    --muted: #7a7568;
    --accent: #c84b2f;
    --accent-light: #f5e8e4;
    --green: #2d6a4f;
    --green-light: #e6f0eb;
    --purple: #4a3880;
    --purple-light: #eeeaf7;
    --amber: #8a5c1a;
    --amber-light: #f5ecd8;
    --blue: #1a4d78;
    --blue-light: #e3eef7;
    --rose: #8a1a3b;
    --rose-light: #f5e4ea;
    --teal: #1a7868;
    --teal-light: #e3f2ef;
    --radius: 12px;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.5;
  }

  header {
    padding: 4rem 2rem 3rem;
    max-width: 900px;
    margin: 0 auto;
    text-align: center;
    position: relative;
    z-index: 1;
  }

  .logo {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }

  h1 {
    font-family: 'DM Mono', monospace;
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: 400;
    line-height: 1.1;
    letter-spacing: -0.02em;
    color: var(--text);
  }

  h1 span { color: var(--accent); }

  .subtitle {
    font-size: 16px;
    color: var(--muted);
    margin-top: 0.75rem;
    font-weight: 300;
  }

  .main {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 2rem 5rem;
    position: relative;
    z-index: 1;
  }

  .unit-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
  }

  .unit-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2rem;
    text-decoration: none;
    color: inherit;
    transition: all 0.2s ease;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  .unit-card:hover {
    border-color: var(--text);
    transform: translateY(-4px);
    box-shadow: 0 12px 24px -12px rgba(0,0,0,0.1);
  }

  .unit-tag {
    align-self: flex-start;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 99px;
    margin-bottom: 1.25rem;
    font-weight: 500;
  }

  .unit-card h2 {
    font-family: 'DM Mono', monospace;
    font-size: 18px;
    font-weight: 400;
    margin-bottom: 0.5rem;
  }

  .unit-card .unit-subtitle {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.4;
    margin-bottom: 1.5rem;
    flex: 1;
  }

  .progress-container {
    margin-bottom: 1.5rem;
  }

  .progress-bar-bg {
    height: 4px;
    background: var(--bg);
    border-radius: 2px;
    margin-bottom: 0.75rem;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: var(--text);
    border-radius: 2px;
    transition: width 0.3s ease;
  }

  .unit-stats {
    display: flex;
    justify-content: space-between;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  .study-btn {
    width: 100%;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    text-align: center;
    transition: all 0.15s ease;
    margin-top: 0.5rem;
  }

  .unit-card:hover .study-btn {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
  }

  .unit-card.full-width {
    grid-column: 1 / -1;
  }

  .unit-card.full-width:hover {
    border-color: var(--accent);
  }

  .unit-card.full-width:hover .study-btn {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  /* Unit Colors */
  .tag-unit1  { background: var(--green-light); color: var(--green); }
  .tag-unit2  { background: var(--purple-light); color: var(--purple); }
  .tag-unit3  { background: var(--amber-light); color: var(--amber); }
  .tag-unit4  { background: var(--blue-light); color: var(--blue); }
  .tag-unit5  { background: var(--rose-light); color: var(--rose); }
  .tag-unit6  { background: var(--teal-light); color: var(--teal); }

  footer {
    max-width: 900px;
    margin: 0 auto;
    padding: 3rem 2rem;
    border-top: 1px solid var(--border);
    text-align: center;
    position: relative;
    z-index: 1;
  }

  .footer-text {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 1rem;
  }

  .social-links {
    display: flex;
    gap: 1.5rem;
    justify-content: center;
    align-items: center;
  }

  .social-links a {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--text);
    text-decoration: none;
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 99px;
    transition: all 0.15s ease;
  }

  .social-links a:hover {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
  }

  @media (max-width: 640px) {
    .unit-grid { grid-template-columns: 1fr; }
    header { padding: 3rem 1.5rem 2rem; }
    .main { padding: 0 1.5rem 3rem; }
  }
</style>
</head>
<body>

<header>
  <p class="logo">A-Level Chemistry</p>
  <h1>IAL <span>Chemistry</span></h1>
  <p class="subtitle" id="globalSubtitle">6 units · 140+ cards · spaced repetition</p>
</header>

<div class="main">
  <div class="unit-grid" id="unitGrid">
    <!-- Unit cards will be injected here -->
  </div>
</div>

<footer>
  <p class="footer-text">Created for A-Level Chemistry revision</p>
  <div class="social-links">
    <a href="https://github.com/saucynandhu" target="_blank" rel="noopener noreferrer">GitHub</a>
    <a href="https://instagram.com/nandhu_sauce" target="_blank" rel="noopener noreferrer">Instagram</a>
  </div>
</footer>

<script src="cards.js"></script>
<script src="shared.js"></script>
<script>
const UNITS = [
  { key: 'unit1', title: 'Unit 1', subtitle: 'Structure, Bonding and Introduction to Organic Chemistry' },
  { key: 'unit2', title: 'Unit 2', subtitle: 'Energetics, Group Chemistry, Halogenoalkanes and Alcohols' },
  { key: 'unit3', title: 'Unit 3', subtitle: 'Practical Skills in Chemistry I' },
  { key: 'unit4', title: 'Unit 4', subtitle: 'Rates, Equilibria and Further Organic Chemistry' },
  { key: 'unit5', title: 'Unit 5', subtitle: 'Transition Metals and Organic Nitrogen Chemistry' },
  { key: 'unit6', title: 'Unit 6', subtitle: 'Practical Skills in Chemistry II' }
];

function renderHome() {
  const grid = document.getElementById('unitGrid');
  const allCards = storage.getCards();
  let totalCards = 0;
  
  grid.innerHTML = '';
  
  UNITS.forEach(unit => {
    const unitCards = allCards.filter(c => c.cat === unit.key);
    totalCards += unitCards.length;
    
    const masteredCards = unitCards.filter(c => c.mastery >= 2).length;
    const masteryPct = unitCards.length > 0 ? Math.round((masteredCards / unitCards.length) * 100) : 0;
    
    const card = document.createElement('a');
    card.href = `${unit.key}.html`;
    card.className = 'unit-card';
    card.innerHTML = `
      <span class="unit-tag tag-${unit.key}">${unit.key}</span>
      <h2>${unit.title}</h2>
      <p class="unit-subtitle">${unit.subtitle}</p>
      
      <div class="progress-container">
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" style="width: ${masteryPct}%"></div>
        </div>
        <div class="unit-stats">
          <span>${unitCards.length} cards</span>
          <span>${masteryPct}% mastered</span>
        </div>
      </div>
      
      <div class="study-btn">→ Study</div>
    `;
    grid.appendChild(card);
  });
  
  // Add Reactions card
  const rxnCard = document.createElement('a');
  rxnCard.href = `reactions.html`;
  rxnCard.className = 'unit-card full-width';
  rxnCard.innerHTML = `
    <span class="unit-tag" style="background: var(--accent); color: white;">Reactions</span>
    <h2>All Units</h2>
    <p class="unit-subtitle">Comprehensive reference of reagents, conditions, mechanisms and observations for Units 1–6.</p>
    
    <div class="progress-container">
      <div class="unit-stats" style="margin-top: 0;">
        <span>60+ reaction cards</span>
        <span>Full Reference</span>
      </div>
    </div>
    
    <div class="study-btn" style="border-color: var(--accent); color: var(--accent);">→ Study Reactions</div>
  `;
  grid.appendChild(rxnCard);
  
  document.getElementById('globalSubtitle').textContent = `6 units · ${totalCards} cards · spaced repetition`;
}

document.addEventListener('DOMContentLoaded', renderHome);
</script>
</body>
</html>
